{% load static %}

<html data-bs-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Petconecta{% endblock %}</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />

        <!-- Bootstrap 6 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
            crossorigin="anonymous"
        />

        <style>
            :root {
                --bs-body-font-family: "Inter", system-ui, sans-serif;

                --bs-bg-body: light-dark(var(--bs-pewter-025), var(--bs-pewter-975));
                --bs-bg-secondary: light-dark(var(--bs-pewter-100), var(--bs-pewter-900));
                --bs-bg-subtle: light-dark(var(--bs-pewter-300), var(--bs-pewter-950));
                --bs-bg-muted: light-dark(var(--bs-pewter-050), var(--bs-pewter-800));

                --bs-bg-1: light-dark(var(--bs-pewter-100), var(--bs-pewter-950));
                --bs-bg-2: light-dark(var(--bs-pewter-200), var(--bs-pewter-900));
                --bs-bg-3: light-dark(var(--bs-pewter-300), var(--bs-pewter-800));
                --bs-bg-4: light-dark(var(--bs-pewter-400), var(--bs-pewter-700));
            }
        </style>
    </head>
    <body>
        <div class="nav-overflow p-2" data-bs-toggle="nav-overflow">
            <ul class="nav nav-pills">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">
                        Início
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Adoção</a>
                </li>
            </ul>
        </div>

        <main class="p-6">
            {% block content %}
            {% endblock %}
        </main>

        <script
            type="module"
            src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
