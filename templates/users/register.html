{% extends 'base.html' %}
{% load static %}

{% block title %}Petconecta - Cadastro{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/forms.css' %}" />
{% endblock %}

{% block content %}
<div class="form-wrap">
  <section class="card">
    <div class="card__body">
      <h1 class="card__title">Crie sua conta</h1>

      <form method="post" novalidate>
        {% include 'partials/form.html' with submit_label="Criar conta" %}
      </form>

      <p class="card__footer">
        Já tem uma conta?
        <a href="{% url 'login' %}">Entrar</a>
      </p>
    </div>
  </section>
</div>
{% endblock %}
